<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>鹈鹕骑士 · Pelican Rider</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23201a3a'/%3E%3Ctext x='32' y='45' font-size='36' text-anchor='middle'%3E🚲%3C/text%3E%3C/svg%3E">

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#07080f;color:#fff;font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.bar{position:fixed;left:0;right:0;height:0;background:#000;z-index:5;transition:height .9s cubic-bezier(.6,0,.2,1)}
#barT{top:0}#barB{bottom:0}
body.cine .bar{height:11vh}
#hud{position:fixed;inset:0;z-index:6;pointer-events:none;opacity:0;transition:opacity .6s}
body.playing #hud{opacity:1}
body.cine #hud .fade{opacity:0}
.fade{transition:opacity .5s}
#tl{position:absolute;left:max(18px,env(safe-area-inset-left));top:16px;display:flex;flex-direction:column;gap:8px;text-shadow:0 2px 10px rgba(0,0,0,.6)}
#hearts{font-size:26px;letter-spacing:4px}
#hearts i{font-style:normal;color:#ff5a6e;filter:drop-shadow(0 0 6px rgba(255,80,110,.8))}
#hearts i.off{color:rgba(255,255,255,.22);filter:none}
.row{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:600}
.row b{font-variant-numeric:tabular-nums;min-width:28px}
#nitro{width:170px;height:9px;border-radius:9px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.3);overflow:hidden}
#nitro i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb238,#ff4a1c);box-shadow:0 0 12px #ff6a1c}
#nitro.ready{border-color:#ffd27a}
.lbl{font-size:11px;letter-spacing:.2em;opacity:.75}
#buffs{display:flex;gap:6px;font-size:13px}
#buffs span{padding:3px 9px;border-radius:20px;background:rgba(10,14,30,.55);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(6px)}
#tr{position:absolute;right:max(18px,env(safe-area-inset-right));top:14px;text-align:right;text-shadow:0 2px 10px rgba(0,0,0,.6)}
#score{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em}
#dist{font-size:13px;letter-spacing:.16em;opacity:.8}
#combo{font-size:18px;font-weight:700;color:#ffd27a;height:24px;margin-top:4px}
#boss{position:absolute;left:50%;top:18px;transform:translateX(-50%);width:min(46vw,460px);opacity:0;transition:opacity .5s;text-align:center}
#boss.on{opacity:1}
#bossName{font-family:"ZCOOL XiaoWei",serif;font-size:17px;letter-spacing:.3em;margin-bottom:5px;text-shadow:0 2px 8px #000}
#bossBar{height:10px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.4);border-radius:2px;overflow:hidden}
#bossBar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff3b3b,#ffb238);transition:width .15s}
#msg{position:absolute;left:0;right:0;top:27%;text-align:center;font-family:"ZCOOL XiaoWei",serif;pointer-events:none}
#msg .m{display:inline-block;animation:pop 2.6s both}
#msg .big{font-size:clamp(30px,5.4vw,66px);letter-spacing:.28em;text-shadow:0 4px 30px rgba(0,0,0,.7)}
#msg .sub{font-size:clamp(13px,1.6vw,19px);letter-spacing:.5em;opacity:.85;margin-top:8px;font-family:"Segoe UI",sans-serif;text-transform:uppercase}
@keyframes pop{0%{opacity:0;transform:scale(1.25);filter:blur(8px)}12%{opacity:1;transform:none;filter:none}80%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
#toast{position:absolute;left:50%;bottom:19%;transform:translateX(-50%);font-size:17px;font-weight:700;letter-spacing:.1em;text-shadow:0 2px 10px #000;white-space:nowrap}
#toast span{display:block;animation:pop 1.3s both;text-align:center}
.overlay{position:fixed;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:opacity .7s;padding:20px}
.overlay.hidden{opacity:0;pointer-events:none}
#title{justify-content:flex-end;align-items:flex-start;text-align:left;padding:0 0 15vh 7vw;background:linear-gradient(90deg,rgba(5,6,16,.62) 0%,rgba(5,6,16,.25) 45%,rgba(0,0,0,0) 70%)}
#title .keys{justify-content:flex-start;max-width:560px}
@media(max-aspect-ratio:1/1){#title{align-items:center;text-align:center;padding:0 16px 14vh;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(5,6,16,.75) 100%)}#title .keys{justify-content:center}}
h1{font-family:"ZCOOL XiaoWei",serif;font-weight:400;font-size:clamp(44px,7.5vw,104px);letter-spacing:.32em;margin-right:-.32em;text-shadow:0 6px 40px rgba(0,0,0,.6);line-height:1.1}
.en{font-size:clamp(12px,1.5vw,18px);letter-spacing:.9em;margin-right:-.9em;opacity:.85;margin-top:4px}
.story{margin-top:18px;font-size:clamp(14px,1.6vw,18px);opacity:.92;letter-spacing:.12em;text-shadow:0 2px 8px #000}
.keys{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;font-size:13px;opacity:.85}
.keys kbd{display:inline-block;padding:2px 8px;border:1px solid rgba(255,255,255,.5);border-radius:5px;font-family:inherit;margin-right:5px;background:rgba(255,255,255,.08)}
button.go{pointer-events:auto;margin-top:24px;padding:13px 46px;font-size:18px;letter-spacing:.4em;color:#1b1206;background:linear-gradient(180deg,#ffe3a6,#ffb238);border:0;border-radius:40px;cursor:pointer;font-family:"ZCOOL XiaoWei",serif;box-shadow:0 8px 34px rgba(255,170,50,.5);transition:transform .15s}
button.go:hover{transform:scale(1.06)}
button.ghost{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.5);box-shadow:none;margin-left:10px}
#over{background:radial-gradient(ellipse at center,rgba(5,6,16,.5),rgba(5,6,16,.88))}
#over h2{font-family:"ZCOOL XiaoWei",serif;font-weight:400;font-size:clamp(34px,6vw,72px);letter-spacing:.3em;margin-right:-.3em}
#stats{margin-top:18px;display:grid;grid-template-columns:auto auto;gap:6px 26px;font-size:17px;text-align:left}
#stats b{text-align:right;font-variant-numeric:tabular-nums;color:#ffd27a}
#load{position:fixed;inset:0;z-index:20;background:#07080f;display:flex;align-items:center;justify-content:center;font-size:14px;letter-spacing:.5em;transition:opacity .8s}
#touch{position:fixed;inset:0;z-index:7;pointer-events:none;display:none}
body.touch.playing #touch{display:block}
#touch button{pointer-events:auto;position:absolute;width:74px;height:74px;border-radius:50%;border:1px solid rgba(255,255,255,.5);background:rgba(10,14,30,.4);color:#fff;font-size:30px;backdrop-filter:blur(4px)}
#bFire{right:22px;bottom:26px;width:92px!important;height:92px!important}#bJump{right:128px;bottom:22px}#bBoost{right:36px;bottom:132px}
#ver{position:fixed;right:10px;bottom:6px;z-index:9;font-size:10px;opacity:.4}
</style>

<div class="bar" id="barT"></div><div class="bar" id="barB"></div>
<div id="hud">
  <div id="tl" class="fade">
    <div id="hearts"></div>
    <div class="row"><span>🐟</span><b id="ammo">0</b><span class="lbl" id="ammoL"></span></div>

    <div id="buffs"></div>
  </div>
  <div id="tr" class="fade"><div id="score">0</div><div id="dist">0 M</div><div id="combo"></div></div>

  <div id="msg"></div><div id="toast"></div>
</div>
<div id="touch"><button id="bJump">⤴</button><button id="bBoost">🌶</button><button id="bFire">🐟</button></div>
<div id="title" class="overlay">
  <h1>鹈鹕骑士</h1><div class="en">PELICAN RIDER</div>

  <div class="keys">
    <span><kbd>A</kbd><kbd>D</kbd>/<kbd>←</kbd><kbd>→</kbd>转向</span><span><kbd>空格</kbd>/鼠标 吐鱼攻击</span>
    <span><kbd>W</kbd>/<kbd>↑</kbd>跳跃</span><span><kbd>Shift</kbd>辣椒氮气（可撞飞敌人）</span><span><kbd>P</kbd>暂停 <kbd>M</kbd>静音</span>

  <div id="stats"></div>
  <div><button class="go" id="again">再来一次</button><button class="go ghost" id="cont" style="display:none">继续无尽模式</button></div>
</div>
<div id="load">LOADING</div>
<div id="ver"></div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {ShaderPass} from 'three/addons/postprocessing/ShaderPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
import {mergeGeometries,mergeVertices} from 'three/addons/utils/BufferGeometryUtils.js';

const VERSION='0.1';
const $=id=>document.getElementById(id);
$('ver').textContent='v'+VERSION;
const rand=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,damp=(a,b,k,dt)=>lerp(a,b,1-Math.exp(-k*dt));
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const pick=a=>a[Math.random()*a.length|0];
const UP=new THREE.Vector3(0,1,0),V=(x=0,y=0,z=0)=>new THREE.Vector3(x,y,z);
const TOUCH=matchMedia('(pointer:coarse)').matches;if(TOUCH)document.body.classList.add('touch');

// ───────────────────────── renderer ─────────────────────────
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});
let PR=Math.min(devicePixelRatio||1,TOUCH?1.25:1.5);
renderer.setPixelRatio(PR);renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,7000);
scene.fog=new THREE.FogExp2(0xffffff,.0026);

// shared uniforms (sky, ocean, particles and every bent material read these)
const U={bend:{value:new THREE.Vector2()},time:{value:0},dist:{value:0},
  zen:{value:new THREE.Color()},hor:{value:new THREE.Color()},sunDir:{value:V(0,1,0)},sunCol:{value:new THREE.Color()},
  cloudL:{value:new THREE.Color()},cloudD:{value:new THREE.Color()},stars:{value:0},disc:{value:1},
  deep:{value:new THREE.Color()},foam:{value:new THREE.Color()},fogCol:{value:new THREE.Color()},fogD:{value:.0026}};

// "curved world": every material shifts vertices in view space by depth², so the road sweeps and rolls
// while game logic and shadows stay in straight space.
const BEND_V='float bz=min(-mvPosition.z,420.);mvPosition.xy+=uBend*bz*bz;gl_Position=projectionMatrix*mvPosition;';
function bendCompile(sh){sh.uniforms.uBend=U.bend;sh.vertexShader='uniform vec2 uBend;\n'+sh.vertexShader.replace('#include <project_vertex>','#include <project_vertex>\n'+BEND_V);}
const B=m=>{m.onBeforeCompile=bendCompile;return m;};
const std=o=>B(new THREE.MeshStandardMaterial(o)),phy=o=>B(new THREE.MeshPhysicalMaterial(o)),bas=o=>B(new THREE.MeshBasicMaterial(o));

// ───────────────────────── procedural textures ─────────────────────────
function mkNoise(P,seed){const g=new Float32Array(P*P);let s=seed;for(let i=0;i<P*P;i++){s=(s*16807)%2147483647;g[i]=s/2147483647;}
  return(x,y)=>{x=((x%P)+P)%P;y=((y%P)+P)%P;const xi=x|0,yi=y|0,xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf),x1=(xi+1)%P,y1=(yi+1)%P;
    return lerp(lerp(g[yi*P+xi],g[yi*P+x1],u),lerp(g[y1*P+xi],g[y1*P+x1],u),v);};}
function tfbm(seed,oct=[8,16,32,64]){const ns=oct.map((p,i)=>[mkNoise(p,seed+i*77),p]);return(u,v)=>{let a=.5,s=0,t=0;for(const[n,p]of ns){s+=a*n(u*p,v*p);t+=a;a*=.5;}return s/t;};}
function canvasTex(w,h,draw,srgb=true){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=8;if(srgb)t.colorSpace=THREE.SRGBColorSpace;return t;}
function normalTex(size,hf,str){const H=new Float32Array(size*size),d=new Uint8Array(size*size*4);
  for(let y=0;y<size;y++)for(let x=0;x<size;x++)H[y*size+x]=hf(x/size,y/size);
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){const l=H[y*size+(x+size-1)%size],r=H[y*size+(x+1)%size],u=H[((y+size-1)%size)*size+x],dn=H[((y+1)%size)*size+x];
    let nx=(l-r)*str,ny=(u-dn)*str,nz=1,k=1/Math.hypot(nx,ny,nz),i=(y*size+x)*4;d[i]=(nx*k*.5+.5)*255;d[i+1]=(ny*k*.5+.5)*255;d[i+2]=(nz*k*.5+.5)*255;d[i+3]=255;}
  const t=new THREE.DataTexture(d,size,size);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.generateMipmaps=true;t.minFilter=THREE.LinearMipmapLinearFilter;t.magFilter=THREE.LinearFilter;t.anisotropy=8;t.needsUpdate=true;return t;}
function speckle(g,w,h,amt,alpha=1){const im=g.getImageData(0,0,w,h),d=im.data;for(let i=0;i<d.length;i+=4){const n=(Math.random()-.5)*amt;d[i]+=n;d[i+1]+=n;d[i+2]+=n;}g.putImageData(im,0,0);}

const fA=tfbm(11),fB=tfbm(29,[16,32,64,128]);
const roadMap=canvasTex(512,1024,(g,w,h)=>{
  g.fillStyle='#34343a';g.fillRect(0,0,w,h);
  for(let i=0;i<60;i++){g.fillStyle=`rgba(${rand()<.5?20:70},${rand()<.5?20:68},${rand()<.5?24:72},${rand(.04,.12)})`;g.beginPath();g.ellipse(rand(w),rand(h),rand(20,90),rand(30,160),rand(3),0,7);g.fill();}
  speckle(g,w,h,20);
  g.strokeStyle='rgba(12,12,14,.7)';g.lineWidth=1.6;for(let i=0;i<9;i++){let x=rand(w),y=rand(h);g.beginPath();g.moveTo(x,y);for(let k=0;k<9;k++){x+=rand(-26,26);y+=rand(10,50);g.lineTo(x,y);}g.stroke();}
  g.fillStyle='rgba(18,18,20,.2)';for(const u of[1/6,.5,5/6]){g.fillRect(u*w-34,0,22,h);g.fillRect(u*w+12,0,22,h);}       // tyre tracks
  g.fillStyle='rgba(236,232,220,.9)';g.fillRect(w*.035,0,9,h);g.fillRect(w*.965-9,0,9,h);
  g.fillStyle='rgba(240,214,150,.92)';for(const u of[1/3,2/3])g.fillRect(u*w-4,h*.1,8,h*.36);
  g.globalCompositeOperation='destination-out';for(let i=0;i<900;i++){g.fillStyle=`rgba(0,0,0,${rand(.1,.5)})`;g.fillRect(rand(w),rand(h),rand(1,5),rand(2,9));}});
const roadRough=canvasTex(256,512,(g,w,h)=>{g.fillStyle='#a8a8a8';g.fillRect(0,0,w,h);
  for(let i=0;i<40;i++){g.fillStyle=`rgba(${rand()<.5?60:210},${rand()<.5?60:210},${rand()<.5?60:210},.18)`;g.beginPath();g.ellipse(rand(w),rand(h),rand(10,50),rand(20,90),rand(3),0,7);g.fill();}
  g.fillStyle='rgba(70,70,70,.45)';for(const u of[1/6,.5,5/6]){g.fillRect(u*w-17,0,11,h);g.fillRect(u*w+6,0,11,h);}speckle(g,w,h,60);},false);
const roadNorm=normalTex(256,(u,v)=>fB(u,v)+fA(u*2,v*2)*.5,5);
const detailMap=canvasTex(256,256,(g,w,h)=>{const im=g.createImageData(w,h),d=im.data;for(let y=0;y<h;y++)for(let x=0;x<w;x++){const n=(.62+fA(x/w,y/h)*.5+fB(x/w,y/h)*.3+(Math.random()-.5)*.14)*255,i=(y*w+x)*4;d[i]=d[i+1]=d[i+2]=n;d[i+3]=255;}g.putImageData(im,0,0);});
const groundNorm=normalTex(256,(u,v)=>fA(u,v)+fB(u,v)*.6,7);
const woodMap=canvasTex(256,256,(g,w,h)=>{g.fillStyle='#9a6a3a';g.fillRect(0,0,w,h);for(let i=0;i<4;i++){g.fillStyle=`rgb(${150+rand(30)|0},${100+rand(22)|0},${52+rand(18)|0})`;g.fillRect(0,i*64+3,w,58);}
  g.strokeStyle='rgba(60,34,14,.35)';for(let i=0;i<70;i++){g.lineWidth=rand(.5,2);const y=rand(h);g.beginPath();g.moveTo(0,y);g.bezierCurveTo(80,y+rand(-5,5),170,y+rand(-5,5),w,y+rand(-3,3));g.stroke();}
  g.strokeStyle='#5a3a1c';g.lineWidth=14;g.strokeRect(0,0,w,h);g.beginPath();g.moveTo(0,0);g.lineTo(w,h);g.stroke();speckle(g,w,h,18);});
const glowTex=canvasTex(128,128,(g,w,h)=>{const r=g.createRadialGradient(64,64,0,64,64,64);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.35,'rgba(255,255,255,.45)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,w,h);});
const coneTex=canvasTex(8,128,(g,w,h)=>{const r=g.createLinearGradient(0,0,0,h);r.addColorStop(0,'rgba(255,255,255,.9)');r.addColorStop(.5,'rgba(255,255,255,.25)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,w,h);});

// ───────────────────────── sky + ocean ─────────────────────────
const GL_NOISE=`float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<5;i++){s+=a*noise(p);p=p*2.03+vec2(17.,9.);a*=.5;}return s;}`;
const GL_SKY=`uniform vec3 uZen,uHor,uSunDir,uSunCol;
vec3 skyBaseG(vec3 d,float gl){float h=clamp(d.y,0.,1.);vec3 c=mix(uHor,uZen,pow(h,.42));float s=max(dot(d,uSunDir),0.);
  c+=uSunCol*(pow(s,5.)*.11+pow(s,36.)*.22+pow(s,300.)*.8)*(1.-.5*h)*gl;return c;}
vec3 skyBase(vec3 d){return skyBaseG(d,1.);}`;
const skyU={uZen:U.zen,uHor:U.hor,uSunDir:U.sunDir,uSunCol:U.sunCol,uCloudL:U.cloudL,uCloudD:U.cloudD,uTime:U.time,uStars:U.stars,uDisc:U.disc};
const skyMat=new THREE.ShaderMaterial({uniforms:skyU,side:THREE.BackSide,depthWrite:false,depthTest:false,fog:false,
  vertexShader:`varying vec3 vDir;void main(){vDir=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`varying vec3 vDir;uniform vec3 uCloudL,uCloudD;uniform float uTime,uStars,uDisc;${GL_SKY}${GL_NOISE}
  void main(){vec3 d=normalize(vDir);vec3 c=skyBase(d);float s=max(dot(d,uSunDir),0.);

function updPlayer(dt){let st=(K.KeyD||K.ArrowRight?1:0)-(K.KeyA||K.ArrowLeft?1:0);if(IN.tx!==null)st=IN.steer;
  if(G.slipT>0){G.slipT-=dt;G.pvx+=Math.sin(G.t*13)*46*dt;st*=.25;}

  const wantBoost=(K.ShiftLeft||K.ShiftRight||K.KeyK||IN.boost)&&G.nitro>0&&(G.boostOn||G.nitro>.15);
  if(wantBoost&&!G.boostOn)SFX.boost();G.boostOn=!!wantBoost;if(G.boostOn)G.nitro=Math.max(0,G.nitro-dt*.27);

  G.speed=damp(G.speed,G.cruise*(G.boostOn?1.7:1),G.boostOn?3:1.4,dt);
  G.fireCd-=dt;if((K.Space||K.KeyJ||IN.fire)&&G.fireCd<=0)fire();
  G.recoil=damp(G.recoil,0,12,dt);G.regen+=dt;if(G.ammo<5&&G.regen>1.3){G.ammo++;G.regen=0;}if(G.ammo>=5)G.regen=0;
  G.invT-=dt;G.shieldT-=dt;G.tripleT-=dt;if(G.comboT>0&&(G.comboT-=dt)<=0)G.combo=0;
  G.score+=G.speed*dt*.5*(1+Math.min(G.combo,20)*.05);
  // dust / flames
  if(G.py<=0&&Math.random()<dt*(14+Math.abs(G.pvx)*6))emitLit(G.px+rand(-.1,.1),.08,.7,rand(-.6,.6)-G.pvx*.2,rand(.3,1.2),-G.speed*.8,rand(.3,.5),rand(.2,.36),1.5,1.35,1.1,.12,-.6,.8,1.6);
  if(G.boostOn)for(let i=0;i<3;i++)emit(G.px+rand(-.12,.12),G.py+.5+rand(.3),.9,rand(-1,1),rand(-.5,1.5),-G.speed+rand(6,12),rand(.2,.45),rand(.5,1),5,rand(1.2,2.4),.3,.9,1,-2,.5,1);}
function updEnts(dt){const D=G.dist,px=G.px,py=G.py,play=G.state==='play';
  for(const e of ents){e.t+=dt;const d=e.d;
    if(e.kind==='en')updEnemy(e,dt);else if(e.kind==='boss')updBoss(e,dt);
    else if(e.type==='barrel'){e.s+=e.vs*dt;e.roll.rotation.x+=(G.speed*.2+6)*dt;}
    else if(e.type==='bomb'){const u=Math.min(e.t/e.T,1);e.x=lerp(e.x0,e.tx,u);e.s=lerp(e.s0,e.ts,u);e.y=lerp(e.y0,.2,u)+Math.sin(u*Math.PI)*4.5;e.mesh.rotation.x+=9*dt;emit(e.x,e.y+.3,zOf(e.s),rand(-1,1),rand(2),-G.speed,.25,.3,5,3,1);
      if(u>=1){e.rm=1;e.mark.rm=1;explode(e.tx,.2,e.ts,1);add('fire',e.ts,e.tx,{life:1.25});}}
    else if(e.type==='mark'){const k=1+Math.sin(e.t*18)*.12;e.mesh.scale.set(k,1,k);}
    else if(e.type==='fire'){e.life-=dt;if(e.life<=0)e.rm=1;const z=zOf(e.s);for(let i=0;i<2;i++)emit(e.x+rand(-1,1),rand(.4),z+rand(-1,1),rand(-.5,.5),rand(2,5),-G.speed,rand(.25,.5),rand(.8,1.6),5,rand(1.2,2.2),.25,.8,1,-2,0,.6);}
    else if(e.kind==='pk'){e.spin.rotation.y+=3*dt;if(e.type!=='shell')e.spin.position.y=1+Math.sin(e.t*3+e.ph)*.12;}
    const rel=e.s-D;e.mesh.position.set(e.x,e.y+(e.kind==='en'?.045*e.mesh.scale.y:0),-rel);
    if(rel<-20||rel>700){e.rm=1;continue;}if(!play||e.dead||e.rm)continue;
    const dx=Math.abs(e.x-px);
    if(e.kind==='pk'){const reach=G.boostOn?1.6:1.15;if(Math.abs(rel)<1.5&&dx<reach&&Math.abs(py+1-e.y)<1.5)collect(e);
      else if(e.type==='shell'&&G.boostOn&&rel<14&&dx<4){e.x=damp(e.x,px,8,dt);e.y=damp(e.y,py+1,8,dt);}}
    else if(e.kind==='ob'||e.kind==='en'||e.kind==='boss'){const rz=(d.rz||d.r)+.75;
      if(Math.abs(rel)<rz&&dx<d.r+.42&&py<e.y+d.h&&py+1.7>e.y){
        if(d.soft&&!G.boostOn&&G.invT<=0){e.rm=1;G.speed*=.72;G.shake=.45;G.combo=0;SFX.hit();sparks(e.x,.4,-rel,8,4,2,.6,6);toast('撞到路锥，减速！','#ffb238');}

  for(let i=ents.length-1;i>=0;i--)if(ents[i].rm){scene.remove(ents[i].mesh);ents.splice(i,1);}}
function collect(e){e.rm=1;const z=zOf(e.s),t=e.type;
  if(t==='shell'){G.score+=10*(1+Math.min(G.combo,20)*.1);G.shells++;G.nitro=Math.min(1,G.nitro+.012);SFX.shell();sparks(e.x,e.y,z,3,5,3.5,.8,3,.14);return;}

  else if(t==='gold'){G.tripleT=10;G.ammo=Math.min(40,G.ammo+8);SFX.power();toast('✨ 黄金三连发','#ffd27a');}
  else if(t==='heart'){G.hp=Math.min(HP_MAX,G.hp+1);SFX.power();toast('♥ +1','#ff8090');}}
function updEnemy(e,dt){const d=e.d;if(e.dead){e.dt+=dt;e.x+=e.vx*dt;e.y+=e.vy*dt;e.vy-=18*dt;e.mesh.rotation.z+=e.vx*.9*dt;e.mesh.rotation.x-=6*dt;if(e.dt>1.8)e.rm=1;return;}

  if(Math.random()<dt*8)emitLit(e.x,.1,zOf(e.s)+.6,rand(-.5,.5),rand(.3,1),-G.speed*.7,.6,rand(.3,.5),1.5,1.35,1.1,.25,-.5,.8,1.5);}

function updShots(dt){for(let i=shots.length-1;i>=0;i--){const p=shots[i],s0=p.s;p.s+=(G.speed+78)*dt;p.life-=dt;p.vy-=6*dt;p.y=Math.max(.4,p.y+p.vy*dt);
    let tg=null,bd=75;for(const e of ents)if(e.d.shoot&&!e.dead&&e.kind!=='ob'){const r=e.s-p.s;if(r>0&&r<bd&&Math.abs(e.x-p.x)<2.2+r*.03){bd=r;tg=e;}}
    if(tg)p.x=damp(p.x,tg.x,5,dt);else p.x+=p.vx*dt;p.vx*=1-2*dt;
    const z=zOf(p.s);p.mesh.position.set(p.x,p.y,z);p.mesh.rotation.z+=14*dt;emit(p.x,p.y,z+.4,0,0,-G.speed*.25,.14,.26,p.gold?2:.3,p.gold?1.3:1,p.gold?.3:2.2,.7);
    let hit=false;for(const e of ents){const d=e.d;if(!d.shoot||e.dead||e.rm)continue;const rz=(d.rz||d.r)+.3;if(e.s+rz<s0||e.s-rz>p.s)continue;if(Math.abs(e.x-p.x)>d.r+.35||p.y>e.y+d.h+.5||p.y<e.y-.3)continue;
      hit=true;sparks(p.x,p.y,zOf(e.s)+rz,10,2,3.5,5,7,.2);
      if(e.kind==='en'){e.hp--;e.punch=1;SFX.hit();if(e.hp<=0)killEnemy(e);}else if(e.kind==='boss'){hitBoss(e,1);SFX.hit();}else breakOb(e,true);break;}
    if(hit||p.life<=0){scene.remove(p.mesh);shots.splice(i,1);}}}

function die(){G.state='dead';G.deadT=0;G.boostOn=false;document.body.classList.remove('cine');explode(G.px,.8,G.dist,.7);}
function finish(win){if(G.state==='over')return;if(win&&G.state!=='play')return;G.state='over';const sc=Math.floor(G.score);if(sc>G.best){G.best=sc;localStorage.setItem('pelican-best',sc);}
  document.body.classList.remove('playing','cine');$('overT').textContent=win?'黄金大鱼夺回来了':'摔车了';$('overE').textContent=win?'MISSION COMPLETE':'WIPEOUT';if(win)SFX.win();
  $('stats').innerHTML=`<span>得分</span><b>${sc.toLocaleString()}</b><span>最高分</span><b>${G.best.toLocaleString()}</b><span>骑行距离</span><b>${Math.floor(G.dist-G.dist0)} m</b><span>击落海鸥</span><b>${G.kills}</b><span>金贝壳</span><b>${G.shells}</b>`;
  $('cont').style.display=win?'':'none';$('over').classList.remove('hidden');}
function start(){audioInit();clearEnts();Object.assign(G,{state:'play',dist0:G.dist,speed:14,px:0,pvx:0,py:0,pvy:0,hp:3,ammo:12,nitro:.35,boostOn:false,shieldT:0,tripleT:0,slipT:0,invT:1,score:0,combo:0,comboT:0,sector:0,secD:0,
    bossOn:false,boss:null,kills:0,shells:0,nextS:G.dist+110,enT:5,slow:0,won:false,paused:false,deadT:0,hurtFx:0});TOD.ph=G.todT=G.todBase=Math.ceil(TOD.ph/4-.001)*4;
  P.root.rotation.set(0,0,0);P.tilt.rotation.set(0,0,0);P.root.visible=true;
  $('title').classList.add('hidden');$('over').classList.add('hidden');$('boss').classList.remove('on');document.body.classList.add('playing');document.body.classList.remove('cine');
  msg(KEYS[0].name,'SECTOR 1 · '+KEYS[0].en);for(const k in hud)delete hud[k];}
function resume(){G.state='play';G.invT=2;$('over').classList.add('hidden');document.body.classList.add('playing');nextSectorMsg();}
function nextSectorMsg(){const k=KEYS[G.sector%4];msg(k.name,`SECTOR ${G.sector+1} · ${k.en} · 无尽模式`);G.enT=4;}

// ───────────────────────── post ─────────────────────────
const rt=new THREE.WebGLRenderTarget(innerWidth*PR,innerHeight*PR,{type:THREE.HalfFloatType,samples:TOUCH?2:4});
const composer=new EffectComposer(renderer,rt);composer.addPass(new RenderPass(scene,camera));
bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth/2,innerHeight/2),.3,.75,1.5);composer.addPass(bloom);
const fx=new ShaderPass({uniforms:{tDiffuse:{value:null},uSun:{value:new THREE.Vector2(.5,.5)},uRay:{value:0},uBlur:{value:0},uCA:{value:1},uTime:{value:0},uAspect:{value:1}},
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`uniform sampler2D tDiffuse;uniform vec2 uSun;uniform float uRay,uBlur,uCA,uTime,uAspect;varying vec2 vUv;
  float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233))+uTime)*43758.5453);}
  void main(){vec2 uv=vUv,c=uv-.5;float j=h(uv*731.);float r2=dot(c,c);vec2 ca=c*r2*uCA*.012;vec3 col;
    if(uBlur>.01){col=vec3(0.);float amt=uBlur*r2*.55;for(int i=0;i<8;i++){float t=(float(i)+j)/8.;vec2 u=uv-c*amt*t;col+=vec3(texture2D(tDiffuse,u+ca).r,texture2D(tDiffuse,u).g,texture2D(tDiffuse,u-ca).b);}col/=8.;}
    else col=vec3(texture2D(tDiffuse,uv+ca).r,texture2D(tDiffuse,uv).g,texture2D(tDiffuse,uv-ca).b);
    if(uRay>.01){vec2 d=uv-uSun;vec3 acc=vec3(0.);float w=1.,ws=0.;for(int i=0;i<18;i++){float t=(float(i)+j)/18.;vec2 su=uv-d*t*.9;vec3 s=min(texture2D(tDiffuse,su).rgb,vec3(6.));float l=max(max(s.r,s.g),s.b);acc+=s*smoothstep(1.1,3.2,l)*w*smoothstep(.5,.12,length((su-uSun)*vec2(uAspect,1.)));ws+=w;w*=.93;}
      float fall=exp(-length(d*vec2(uAspect,1.))*1.9);col+=acc/ws*uRay*fall*1.3;
      vec2 gp=vec2(.5)-(uSun-.5)*.55;float gd=length((uv-gp)*vec2(uAspect,1.));col+=vec3(1.,.6,.3)*smoothstep(.07,.0,gd)*.05*uRay;   // lens ghost
      gp=vec2(.5)-(uSun-.5)*1.1;gd=length((uv-gp)*vec2(uAspect,1.));col+=vec3(.4,.7,1.)*smoothstep(.12,.09,gd)*smoothstep(.07,.1,gd)*.035*uRay;}
    gl_FragColor=vec4(col,1.);}`});composer.addPass(fx);
composer.addPass(new OutputPass());
const grade=new ShaderPass({uniforms:{tDiffuse:{value:null},uTime:{value:0},uHurt:{value:0},uNight:{value:0},uBoost:{value:0}},
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`uniform sampler2D tDiffuse;uniform float uTime,uHurt,uNight,uBoost;varying vec2 vUv;
  float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233))+uTime*7.)*43758.5453);}
  void main(){vec3 c=texture2D(tDiffuse,vUv).rgb;float l=dot(c,vec3(.299,.587,.114));
    c+=vec3(-.02,.006,.03)*(1.-l)*(1.-l)+vec3(.03,.012,-.02)*l*l;                 // teal shadows, warm highlights
    c=mix(vec3(l),c,1.14);c=mix(c,c*c*(3.-2.*c),.35);
    vec2 q=vUv-.5;float v=dot(q,q);c*=1.-v*(1.05+uBoost*.6);
    c=mix(c,vec3(.9,.05,.05),uHurt*smoothstep(.05,.5,v)*.75);
    c+=(h(vUv*913.)-.5)*(.035+uNight*.02);
    gl_FragColor=vec4(c,1.);}`});composer.addPass(grade);
function resize(){const w=innerWidth,h=innerHeight;renderer.setPixelRatio(PR);renderer.setSize(w,h);composer.setPixelRatio(PR);composer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();
  fx.uniforms.uAspect.value=w/h;pMat.uniforms.uScale.value=h*PR*.9;}
addEventListener('resize',resize);resize();

// ───────────────────────── input ─────────────────────────
addEventListener('keydown',e=>{if(e.repeat)return;K[e.code]=1;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  if(e.code==='KeyW'||e.code==='ArrowUp')tryJump();
  if(e.code==='Enter'||e.code==='Space'){if(G.state==='title')start();else if(G.state==='over'&&e.code==='Enter')start();}
  if((e.code==='KeyP'||e.code==='Escape')&&G.state==='play'){G.paused=!G.paused;if(G.paused)msg('暂停','按 P 继续');else $('msg').innerHTML='';}
  if(e.code==='KeyM'&&AU.ctx){AU.mute=!AU.mute;AU.master.gain.value=AU.mute?0:.6;toast(AU.mute?'静音':'声音开');}});
addEventListener('keyup',e=>{K[e.code]=0;});addEventListener('blur',()=>{for(const k in K)K[k]=0;IN.fire=false;});
const cv=renderer.domElement;
cv.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'){if(e.button===0)IN.fire=true;}else{IN.tx=e.clientX;IN.steer=0;}});
addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'&&IN.tx!==null)IN.steer=clamp((e.clientX-IN.tx)/55,-1,1);});
addEventListener('pointerup',e=>{if(e.pointerType==='mouse')IN.fire=false;else if(e.target===cv){IN.tx=null;IN.steer=0;}});
cv.addEventListener('contextmenu',e=>e.preventDefault());
const hold=(id,on,off)=>{const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();on();});for(const n of['pointerup','pointercancel','pointerleave'])b.addEventListener(n,()=>off&&off());};
hold('bFire',()=>IN.fire=true,()=>IN.fire=false);hold('bBoost',()=>IN.boost=true,()=>IN.boost=false);hold('bJump',tryJump);
$('start').onclick=start;$('again').onclick=start;$('cont').onclick=resume;

// ───────────────────────── main loop ─────────────────────────
const camP=V(-2.8,1.1,3.8),camL=V(.5,1.3,-2),cp=V(),cl=V(),clock=new THREE.Clock();let fAcc=0,fN=0,camRoll=0;
function updCamera(dt){let fov=62,k=3,kx=0;
  if(G.state==='title'){const a=G.t*.12;cp.set(-2.9+Math.sin(a)*.8,1.05+Math.sin(a*.7)*.25,3.6+Math.cos(a)*.5);cl.set(-.35,1.3,-3);fov=48;k=1.2;}
  else if(G.state==='dead'||G.state==='over'&&!G.won){const a=G.deadT*.5;cp.set(G.px+Math.sin(a)*5,2.2,Math.cos(a)*5+1);cl.set(G.px,.8,0);fov=50;k=2;}
  else if(G.boss&&G.bossT<3.2&&!G.boss.dead){const z=-(G.boss.s-G.dist);cp.set(G.px+2.6,1.25,4.6);cl.set(G.boss.x*.5,1.8,z*.6);fov=44;k=2.5;}
  else{cp.set(G.px*.42,2.75+G.py*.3,6.1);cl.set(G.px*.34,1.5+G.py*.3,-11);kx=2.2;fov=63+(G.speed-24)*.55+(G.boostOn?6:0);k=5;}
  if(camera.aspect<1)fov+=22;
  camP.x=damp(camP.x,cp.x,kx||k,dt);camP.y=damp(camP.y,cp.y,k,dt);camP.z=damp(camP.z,cp.z,k,dt);camL.x=damp(camL.x,cl.x,kx||k,dt);camL.y=damp(camL.y,cl.y,k,dt);camL.z=damp(camL.z,cl.z,k,dt);
  camera.position.copy(camP);const sh=G.shake*G.shake*.2+(G.boostOn?.012:0);camera.position.x+=rand(-sh,sh);camera.position.y+=rand(-sh,sh);
  camera.lookAt(camL);camRoll=damp(camRoll,G.state==='play'?U.bend.value.x*14:0,2,dt);camera.rotateZ(camRoll);
  camera.fov=damp(camera.fov,fov,3,dt);camera.updateProjectionMatrix();sky.position.copy(camera.position);}
const sv=V();
function frame(){requestAnimationFrame(frame);const T0=performance.now();let rdt=Math.min(clock.getDelta(),.05);
  if(G.state==='play'&&G.paused){composer.render();return;}
  if(G.slow>0){G.slow-=rdt;G.ts=damp(G.ts,.28,10,rdt);}else G.ts=damp(G.ts,1,4,rdt);
  const dt=rdt*G.ts;G.t+=dt;U.time.value=G.t;
  // world
  if(G.state==='title'){G.speed=damp(G.speed,13,1,dt);G.px=Math.sin(G.t*.3)*.8;G.pvx=Math.cos(G.t*.3)*.24;}
  else if(G.state==='play'){updPlayer(dt);G.secD+=G.speed*dt;if(!G.bossOn&&G.secD>secLen())startBoss();}
  else if(G.state==='dead'){G.deadT+=dt;G.speed=damp(G.speed,0,2.2,dt);G.pvx=damp(G.pvx,0,3,dt);P.tilt.rotation.z=damp(P.tilt.rotation.z,1.45,5,dt);P.tilt.position.y=damp(P.tilt.position.y,.12,5,dt);if(G.deadT>1.7)finish(false);}
  else if(G.state==='over'){G.deadT+=dt;G.speed=damp(G.speed,G.won&&G.hp>0?14:0,1.5,dt);G.pvx=damp(G.pvx,0,3,dt);}
  G.dist+=G.speed*dt;U.dist.value=G.dist;const D=G.dist;
  U.bend.value.set((Math.sin(D*.0042)+Math.sin(D*.0017+1.3)*.6)*.00052,Math.sin(D*.0027)*.00009);
  roadMap.offset.y=roadRough.offset.y=-(D/12)%1;roadNorm.offset.y=-(D/3)%1;detailMap.offset.y=groundNorm.offset.y=-(D/5)%1;
  for(const d of DECOR)d.update(D);
  spawnAhead(dt);updEnts(dt);updShots(dt);updParticles(dt);
  G.shake=damp(G.shake,0,5,rdt);G.hurtFx=damp(G.hurtFx,0,2.5,rdt);
  // pelican
  if(G.state!=='dead'&&!(G.state==='over'&&G.hp<=0)){P.tilt.rotation.z=damp(P.tilt.rotation.z,-G.pvx*.045,10,dt);P.tilt.position.y=0;P.tilt.rotation.x=damp(P.tilt.rotation.x,G.py>0?clamp(G.pvy*.03,-.25,.3):0,8,dt);}
  P.root.position.set(G.px,G.py+.034,0);P.root.rotation.y=-G.pvx*.016;P.root.visible=!(G.state==='play'&&G.invT>0&&G.invT<1.7&&Math.sin(G.t*40)>0.2&&G.hp>0&&G.shieldT<=0&&!G.boostOn);
  animPelican(dt,G.t);P.bubble.visible=G.shieldT>0;if(G.shieldT>0)P.bubble.rotation.y+=dt;
  // time of day
  TOD.ph=G.todT>TOD.ph?Math.min(G.todT,TOD.ph+rdt*.09):TOD.ph;applyTOD(TOD.ph);
  headLamp.intensity=TOD.night*120;headLamp.position.set(G.px,G.py+1.1,-.5);headLamp.target.position.set(G.px-G.pvx*.3,0,-26);P.lampM.material.color.setScalar(1+TOD.night*5);
  updCamera(rdt);
  // post uniforms
  sv.copy(U.sunDir.value).multiplyScalar(1000).add(camera.position).project(camera);const edge=Math.max(Math.abs(sv.x),Math.abs(sv.y));
  fx.uniforms.uSun.value.set(sv.x*.5+.5,sv.y*.5+.5);fx.uniforms.uRay.value=sv.z<1?TOD.ray*(1-sstep(1.05,1.7,edge)):0;
  const bl=clamp((G.speed-26)/16,0,1.3);fx.uniforms.uBlur.value=damp(fx.uniforms.uBlur.value,G.state==='play'?bl*bl:0,5,rdt);fx.uniforms.uCA.value=1+bl*2+G.hurtFx*4;fx.uniforms.uTime.value=G.t;
  grade.uniforms.uTime.value=G.t;grade.uniforms.uHurt.value=G.hurtFx;grade.uniforms.uNight.value=TOD.night;grade.uniforms.uBoost.value=damp(grade.uniforms.uBoost.value,G.boostOn?1:0,5,rdt);
  if(G.state==='play')updHUD();music();
  composer.render();G.cpu=lerp(G.cpu||0,performance.now()-T0,.05);
  // adaptive resolution
  fAcc+=rdt;if(++fN>=120){const avg=fAcc/fN;fAcc=fN=0;if(avg>1/26&&PR>.7){PR=Math.max(.7,PR-.25);resize();}}}
applyTOD(0);for(const d of DECOR)d.update(0);
renderer.compile(scene,camera);
$('load').style.opacity=0;setTimeout(()=>$('load').remove(),900);document.body.classList.add('cine');
frame();
</script>
